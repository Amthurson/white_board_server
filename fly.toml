app = "white-board-server"
primary_region = "nrt"

[env]
  PORT = "3006"

[http_service]
  internal_port = 3006
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
